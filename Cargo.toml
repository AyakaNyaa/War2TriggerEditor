[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop", "apps/cli"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
contracts = { path = "crates/contracts" }
app-api = { path = "crates/app-api" }
format-pud = { path = "crates/format-pud" }
format-w2tr = { path = "crates/format-w2tr" }
trigger-engine = { path = "crates/trigger-engine" }
storage = { path = "crates/storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
utoipa = "5"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
encoding_rs = "0.8"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = "0.3"
tauri = "2"
tauri-build = "2"
rfd = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = true
